name: Build AEMEATH Android Live Wallpaper

on:
  workflow_dispatch:
  push:
    paths:
      - "AEMEATH_LiveWallpaper_CI_Build.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: unzip -q AEMEATH_LiveWallpaper_CI_Build.zip -d project

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AEMEATH-live-wallpaper-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
